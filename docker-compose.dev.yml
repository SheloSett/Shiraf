# Shiraf — desarrollo, también en contenedor.
#
# El requisito es que en la máquina de trabajo lo único instalado sea Docker: ni
# Node, ni Postgres, ni la CLI de Prisma. Con esto se cumple.
#
#     docker compose -f docker-compose.dev.yml up
#
# El sitio queda en http://localhost:8081 y recarga solo al editar en el host.

services:
  db:
    image: postgres:17
    container_name: shiraf-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: shiraf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shiraf}
      POSTGRES_DB: shiraf
    volumes:
      - shiraf-pgdata-dev:/var/lib/postgresql/data
    # Publicado para poder abrir Prisma Studio o un cliente desde el host.
    #
    # 5434 y no 5432 del lado del HOST: en esta máquina el 5432 ya lo tiene el
    # contenedor `my-database` de otro proyecto, y el 5433 lo usa `ecommerce_db`
    # por exactamente el mismo motivo. Adentro de la red de compose sigue siendo
    # 5432, así que el DATABASE_URL de abajo no cambia.
    #
    # Si en otra máquina hace falta otro, va por variable:
    #   DB_PORT=5555 docker compose -f docker-compose.dev.yml up
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiraf -d shiraf"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # La etapa con node_modules, sin el build de producción. Es oven/bun.
      target: deps
    # ⚠️ Sin esta línea el tag lo arma Docker solo, con el nombre del proyecto
    # más el del servicio: `shiraf` + `app` = `shiraf-app:latest`. Que es
    # EXACTAMENTE el que docker-compose.yml declara para producción, en su
    # servicio `app` y en `migrate`. Los dos composes se pisaban la imagen: el
    # último que construía dejaba la suya en ese tag y el otro arrancaba con
    # ella. Los síntomas no se parecen en nada a la causa — con la de
    # producción corriendo acá, un `docker compose run app bun install` muere
    # con "Cannot find module '/app/bun'", porque esa imagen es node:22-slim y
    # no tiene bun; al revés, el compose de producción arranca con la de dev,
    # que no tiene el `.output` compilado, y falla al levantar.
    image: shiraf-app-dev:latest
    container_name: shiraf-app-dev
    # Tres cosas, y las tres hacen falta:
    #
    # --host 0.0.0.0 · sin esto Vite escucha sólo en el loopback DEL CONTENEDOR
    #                  y desde el navegador del host no se llega.
    # --port 8080    · es el puerto que configura el preset de Lovable. Acá
    #                  estaba publicado el 8081, que es a donde Vite se corre
    #                  SÓLO si el 8080 está ocupado — cosa que pasa en la
    #                  máquina de casa y no adentro de un contenedor limpio. O
    #                  sea que el mapeo apuntaba a un puerto donde no había
    #                  nadie escuchando.
    # --strictPort   · convierte el problema de arriba en un error visible. Sin
    #                  esto, si el puerto estuviera ocupado Vite se corre al
    #                  siguiente en silencio y volvemos a lo mismo: una pestaña
    #                  que no carga y unos logs que dicen que todo está bien.
    #
    # `prisma generate` antes de arrancar, y en cada `up`: la etapa `deps` sólo
    # corre `bun install` con el package.json, sin el schema.prisma a la vista,
    # así que el postinstall de Prisma no genera nada. Sin esto, el primer
    # import de @prisma/client falla pidiendo justamente esto.
    command:
      - sh
      - -c
      - bunx prisma generate && bun run dev --host 0.0.0.0 --port 8080 --strictPort
    volumes:
      # El código, en vivo.
      - .:/app
      # 🔴 Este volumen NO es un detalle. Sin él, el bind mount de arriba tapa el
      # node_modules del contenedor con el del host — que en Windows tiene los
      # binarios de rollup y esbuild compilados para Windows. La app no arranca y
      # el error no dice eso en ningún lado.
      #
      # Y es NOMBRADO, no anónimo. Antes decía `- /app/node_modules`, que crea
      # uno nuevo por contenedor: cada `docker compose run --rm app ...` arrancaba
      # con un node_modules recién salido de la imagen, sin el cliente que dejó
      # `prisma generate`. El sintoma era
      # "Cannot find module '.prisma/client/default'" en cualquier comando suelto
      # —el seed, un script— aunque el contenedor de la app estuviera andando
      # perfecto. Con el volumen nombrado lo comparten todos.
      #
      # Si alguna vez hay que forzar una instalación limpia:
      #   docker compose -f docker-compose.dev.yml up -d --build --renew-anon-volumes
      #   docker volume rm shiraf_node_modules_dev
      - node_modules_dev:/app/node_modules
    ports:
      # HOST:CONTENEDOR, y son dos cosas distintas. Vale la pena entenderlo
      # porque acá ya hubo un bug por confundirlas.
      #
      # El del CONTENEDOR es 8080 y no se elige: es el que configura el preset
      # de Lovable en vite.config.ts, y adentro de un contenedor limpio siempre
      # está libre, así que Vite se ata ahí.
      #
      # El del HOST se elige. Va 8081 porque en esta máquina el 8080 lo tiene
      # tomado Docker Desktop, y publicarlo ahí falla al levantar.
      #
      # Decía "8081:8081", que estaba mal de las dos puntas: apuntaba a un
      # puerto del contenedor donde no había nadie escuchando —Vite sólo usa el
      # 8081 si el 8080 está ocupado, cosa que no pasa adentro del contenedor—.
      # El síntoma era una pestaña en blanco con los logs diciendo que todo
      # estaba bien.
      #   - "8081:8081"
      - "8081:8080"
    env_file: .env
    environment:
      # ⚠️ Pisa lo que diga el .env a propósito. Adentro de la red de compose el
      # host de la base es `db`; desde la máquina es localhost. Tener las dos
      # cosas escritas en el mismo .env es la fuente del error más frecuente de
      # todo el armado.
      DATABASE_URL: postgresql://shiraf:${POSTGRES_PASSWORD:-shiraf}@db:5432/shiraf
      # 🔴 Las dos que hacen que "recarga solo al editar en el host" sea cierto.
      # No lo era: el bind mount de Windows no transporta los avisos de cambio
      # de archivo, así que Vite seguía sirviendo la versión con la que arrancó
      # y editar no hacía nada hasta reiniciar el contenedor. El motivo largo
      # está en vite.config.ts, que es donde se leen estas dos variables.
      #
      # Van acá y no en el vite.config a secas para no cobrarle el costo del
      # sondeo a quien corra `bun run dev` en su máquina, sin contenedor.
      SHIRAF_DEV_POLLING: "1"
      # El 8081 es el puerto del HOST (ver el mapeo de abajo): es a donde le
      # habla el navegador, y adentro Vite escucha en el 8080.
      SHIRAF_DEV_HMR_PORT: "8081"
    depends_on:
      db:
        condition: service_healthy
    # Sin read_only acá: el de producción lo tiene y hay que dejarlo, pero en
    # desarrollo Vite escribe su caché y lo necesita.

volumes:
  shiraf-pgdata-dev:
  node_modules_dev:
