# /etc/nginx/sites-available/shiraf — VPS VIEJO, DESPUÉS del corte (paso 5f).
#
# Reemplaza el bloque que servía Shiraf desde el contenedor local. Ahora el
# nginx viejo reenvía todo al VPS nuevo, por HTTPS y con el mismo Host, para
# que quien todavía resuelva la IP vieja durante la propagación del DNS
# termine en la base nueva y no en un 502. Queda hasta que se dé de baja el
# servidor.
#
# El bloque anterior se guarda antes en /home/shelo/nginx-shiraf-viejo.bak.

server {
    server_name shiraf.com.ar www.shiraf.com.ar;

    location / {
        proxy_pass https://82.25.74.242;
        proxy_ssl_server_name on;
        proxy_ssl_name shiraf.com.ar;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/shiraf.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shiraf.com.ar/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name shiraf.com.ar www.shiraf.com.ar;
    return 301 https://$host$request_uri;
}
