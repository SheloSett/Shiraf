# /etc/nginx/sites-available/shiraf — VPS nuevo (82.25.74.242).
#
# Copia fiel del bloque que estaba en el VPS viejo, con las líneas que había
# escrito certbot. El certificado se trajo del viejo (ver MIGRACION-VPS.md), así
# que las rutas de /etc/letsencrypt existen desde el primer día y certbot lo
# sigue renovando acá con el mismo archivo de renewal.
#
# Instalar:
#   sudo cp ~/nginx-shiraf.conf /etc/nginx/sites-available/shiraf
#   sudo ln -sf /etc/nginx/sites-available/shiraf /etc/nginx/sites-enabled/shiraf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    server_name shiraf.com.ar;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;

        # Las dos con $remote_addr, NO con $proxy_add_x_forwarded_for: ese agrega
        # al final lo que ya venía, y lo que "ya venía" lo escribe quien llama.
        # Con eso el freno a los intentos de login queda salteable aunque nginx
        # esté puesto. Ver DOCKER.md.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;

        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/shiraf.com.ar/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/shiraf.com.ar/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# El www no sirve el sitio: redirige al dominio pelado.
# Sin esto, shiraf.com.ar y www.shiraf.com.ar son dos sitios distintos con el
# mismo contenido para Google, y el posicionamiento se reparte entre los dos.
# El certificado de arriba ya cubre los dos nombres. Ver DOCKER.md en el repo.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.shiraf.com.ar;

    ssl_certificate /etc/letsencrypt/live/shiraf.com.ar/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/shiraf.com.ar/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://shiraf.com.ar$request_uri;
}

server {
    if ($host = www.shiraf.com.ar) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = shiraf.com.ar) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name shiraf.com.ar www.shiraf.com.ar;
    return 404; # managed by Certbot
}
