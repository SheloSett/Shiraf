# Shiraf — producción.
#
# Compose lee automáticamente el .env de esta carpeta para resolver los ${...}.
# Las variables que hacen falta están listadas en .env.example.
#
# El arranque es una cadena, no cuatro servicios sueltos:
#
#     db  ──sano──>  migrate  ──termina bien──>  app
#     └── pg-backup
#
# `migrate` corre una vez, aplica lo que falte y se apaga. Que la app aplique
# migraciones al arrancar está mal en cuanto hay más de una réplica —dos
# procesos migrando la misma base a la vez— y además mezcla responsabilidades.

services:
  db:
    image: postgres:17
    container_name: shiraf-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: shiraf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: shiraf
    volumes:
      - shiraf-pgdata:/var/lib/postgresql/data
    # Sólo loopback: la app le pega por la red interna de compose, donde el host
    # es `db`. Publicarlo acá es para poder abrir Prisma Studio o psql desde la
    # máquina; a internet no tiene que salir nunca.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiraf -d shiraf"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    image: shiraf-app:latest
    container_name: shiraf-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://shiraf:${POSTGRES_PASSWORD}@db:5432/shiraf
    # Se invoca el binario directo y no `npx`: la imagen no tiene npm, y `npx`
    # se bajaría Prisma de internet en cada arranque del contenedor.
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build arg, no environment: se hornea en el bundle del navegador.
        # Es público —aparece en la URL de cada foto— pero sin él no hay fotos.
        VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME:?falta VITE_CLOUDINARY_CLOUD_NAME en .env}
    image: shiraf-app:latest
    container_name: shiraf-app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0

      # `db` y no `localhost`: adentro de la red de compose el host es el nombre
      # del servicio. Es el error más frecuente del armado y el mensaje
      # —getaddrinfo ENOTFOUND db— no lo sugiere.
      DATABASE_URL: postgresql://shiraf:${POSTGRES_PASSWORD}@db:5432/shiraf

      # Firma las sesiones. Si cambia, todas las cuentas quedan deslogueadas.
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      # Para armar los links de los mails de confirmación y de recuperación.
      APP_URL: ${APP_URL:?falta APP_URL en .env}

      # Cloudinary del lado servidor: firma las subidas y los borrados. El api
      # secret NUNCA como build arg ni con prefijo VITE_ — eso lo dejaría
      # horneado en el bundle que baja el navegador, y con él se puede borrar
      # cualquier imagen de la cuenta.
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?falta CLOUDINARY_CLOUD_NAME en .env}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?falta CLOUDINARY_API_KEY en .env}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?falta CLOUDINARY_API_SECRET en .env}

      # Mails: avisos de turno y recordatorios.
      RESEND_API_KEY: ${RESEND_API_KEY:?falta RESEND_API_KEY en .env}
      MAIL_FROM: ${MAIL_FROM:?falta MAIL_FROM en .env}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      # El secreto que autoriza a POST /api/recordatorios, que dispara el cron
      # del VPS. Sin esto el endpoint responde 401 a todo.
      REMINDERS_SECRET: ${REMINDERS_SECRET:?falta REMINDERS_SECRET en .env}

    # Publicado sólo en loopback: en el VPS ya hay un reverse proxy para los
    # otros dos sitios, así que este contenedor no debe quedar expuesto directo
    # a internet. El proxy le pega a 127.0.0.1:3000.
    ports:
      - "127.0.0.1:3000:3000"

    # La app es sin estado: no escribe en disco. Lo que persiste vive en la base,
    # que es otro contenedor con su propio volumen.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Backup diario con rotación. Copiado de Ecommerce_mm, que ya lo tiene andando.
  #
  # ⚠️ La etiqueta de la imagen tiene que coincidir con la versión de Postgres.
  #    En el ecommerce es :15 porque su base es 15. Acá es 17.
  pg-backup:
    image: prodrigestivill/postgres-backup-local:17
    container_name: shiraf-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: shiraf
      POSTGRES_USER: shiraf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "59 23 * * *"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ./backups:/backups

volumes:
  shiraf-pgdata:
