# Shiraf — producción.
#
# Compose lee automáticamente el .env de esta carpeta para resolver los ${...}.
# Las variables que hacen falta están listadas en .env.example.
#
# El arranque es una cadena, no cuatro servicios sueltos:
#
#     db  ──sano──>  migrate  ──termina bien──>  app
#     └── pg-backup
#
# `migrate` corre una vez, sincroniza el esquema y se apaga. Que la app aplique
# migraciones al arrancar está mal en cuanto hay más de una réplica —dos
# procesos migrando la misma base a la vez— y además mezcla responsabilidades.

services:
  db:
    image: postgres:17
    container_name: shiraf-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: shiraf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: shiraf
    volumes:
      - shiraf-pgdata:/var/lib/postgresql/data
    # Sólo loopback: la app le pega por la red interna de compose, donde el host
    # es `db`. Publicarlo acá es para poder abrir Prisma Studio o psql desde la
    # máquina; a internet no tiene que salir nunca.
    #
    # El puerto del host sale por variable porque no siempre está libre: en la
    # máquina de desarrollo lo tienen otros proyectos. En el VPS, donde ésta es
    # la única base, el 5432 por defecto está bien.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiraf -d shiraf"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    image: shiraf-app:latest
    container_name: shiraf-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://shiraf:${POSTGRES_PASSWORD}@db:5432/shiraf
    # Dos pasos, como en Ecommerce_mm:
    #   1. `db push` sincroniza las tablas con schema.prisma
    #   2. post-push vuelve a poner lo que push no sabe manejar (los 3 triggers,
    #      el CHECK de turnos, los 4 indices parciales) y VERIFICA que quedaron.
    #      Si falta alguna, sale con error y la cadena se corta acá: la app no
    #      arranca contra una base a la que le falta el candado de los turnos.
    #
    # Se invoca el binario directo y no `npx`: la imagen no tiene npm, y `npx`
    # se bajaría Prisma de internet en cada arranque del contenedor.
    command:
      - sh
      - -c
      - node node_modules/prisma/build/index.js db push && node scripts/post-push.mjs
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build arg, no environment: se hornea en el bundle del navegador.
        # Es público —aparece en la URL de cada foto— pero sin él no hay fotos.
        VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME:?falta VITE_CLOUDINARY_CLOUD_NAME en .env}
    image: shiraf-app:latest
    container_name: shiraf-app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0

      # `db` y no `localhost`: adentro de la red de compose el host es el nombre
      # del servicio. Es el error más frecuente del armado y el mensaje
      # —getaddrinfo ENOTFOUND db— no lo sugiere.
      DATABASE_URL: postgresql://shiraf:${POSTGRES_PASSWORD}@db:5432/shiraf

      # Firma las sesiones. Si cambia, todas las cuentas quedan deslogueadas.
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      # Para armar los links de los mails de confirmación y de recuperación.
      APP_URL: ${APP_URL:?falta APP_URL en .env}

      # Qué hay adelante de la app. De esto depende que el limitador de intentos
      # de login sirva o sea decorativo: dice de dónde sale la IP de quien
      # llama. Sin definir vale "none" —nadie adelante, la IP sale del socket—,
      # que es lo correcto hoy y lo que menos se puede engañar.
      #
      # Va con `:-` y no con `:?` a propósito: el default es el más
      # desconfiado, así que su ausencia no deja nada abierto. Los valores y
      # cuándo usar cada uno están en src/server/middleware/loginLimiter.ts.
      TRUST_PROXY: ${TRUST_PROXY:-}

      # Cloudinary del lado servidor: firma las subidas y los borrados. El api
      # secret NUNCA como build arg ni con prefijo VITE_ — eso lo dejaría
      # horneado en el bundle que baja el navegador, y con él se puede borrar
      # cualquier imagen de la cuenta.
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?falta CLOUDINARY_CLOUD_NAME en .env}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?falta CLOUDINARY_API_KEY en .env}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?falta CLOUDINARY_API_SECRET en .env}

      # Mails: avisos de turno, recordatorios y los de cuenta (confirmar el
      # mail, recuperar la contraseña). Salen por SMTP con nodemailer, por Brevo,
      # desde avisos@shiraf.com.ar y firmados con el DKIM del dominio.
      #
      # 🔴 Las seis importan ahora, no sólo USER y PASS. Hasta el 4/9/2026 se
      # mandaba por Gmail y las otras cuatro podían faltar; con Brevo, sin HOST,
      # PORT y MAIL_FROM el envío se cae al default de Gmail y no sale nada. El
      # porqué del cambio está en emails/README.md: a Hotmail no le llegaba un
      # solo mail.
      #
      # Todas van con `:-` y NO con `:?`, o sea que su ausencia no frena el
      # arranque. Es a propósito y respeta una decisión que ya vive en el código:
      # email.service.ts devuelve "todavía no está configurado" en vez de tirar —
      #
      #   "Se tiene que poder trabajar sin el correo resuelto. Lo que NO se hace
      #    es tragarse el fracaso en silencio."
      #
      # Con `:?` el contenedor se negaba a levantar, y eso ya pasó: el primer
      # `docker compose up` moría acá porque el correo todavía no estaba
      # resuelto, sin relación aparente con lo que se estaba probando.
      #
      # No es que no haya que configurarlas: hay que hacerlo antes de abrir el
      # centro. Pero eso lo avisa el panel cuando un turno se confirma y el mail
      # no sale, que es donde se entiende. No un compose que no arranca.
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}

      # WhatsApp por la Cloud API de Meta. Las cuatro van vacías por ahora y el
      # canal queda apagado: sin token ni id de número, los avisos salen sólo por
      # mail y nada falla. Encenderlo depende de un trámite con Meta —ver
      # docs/whatsapp-automatico.md—, no de tocar esto.
      #
      # ⚠️ WHATSAPP_PHONE_ID es el ID del número, una tira de dígitos que da el
      # panel de Meta. NO es el número de teléfono.
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      WHATSAPP_LANG: ${WHATSAPP_LANG:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-}

      # WhatsApp por Evolution, el camino que no se le paga a nadie. Es el que
      # se eligió; el de Meta queda ahí por si algún día se paga la vía oficial.
      #
      # Con las tres puestas, los avisos salen por acá y NO por Meta: la
      # prioridad la decide `transporteWhatsapp()` en notifications.server.ts.
      # Vacías, no pasa nada y todo sale por mail.
      #
      # `evolution` y no `localhost`: adentro de la red de compose el host es el
      # nombre del servicio. Es el mismo error que con `db`, y el mensaje
      # —fetch failed— dice todavía menos.
      #
      # Ojo con una asimetría que confunde: estas variables van en la app, que
      # levanta siempre, pero el contenedor que las atiende está detrás del
      # perfil `whatsapp`. Si se configuran y nadie levantó el perfil, cada aviso
      # falla con "No se pudo llamar a Evolution" y sale sólo por mail.
      EVOLUTION_URL: ${EVOLUTION_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCIA: ${EVOLUTION_INSTANCIA:-}
      EVOLUTION_DELAY_MS: ${EVOLUTION_DELAY_MS:-}

      # Acá vivía REMINDERS_SECRET, que era obligatoria —con `:?`, o sea que sin
      # ella el contenedor no levantaba— y ya no existe. Era la llave de
      # POST /api/recordatorios, el endpoint que disparaba un cron de afuera.
      # Ahora el reloj corre adentro del proceso, así que no hay puerta que
      # cerrar con llave: ver src/server/services/reminders.service.ts.

    # Por defecto, sólo loopback: en el VPS ya hay un reverse proxy para los
    # otros dos sitios, así que este contenedor no debe quedar expuesto directo a
    # internet. El proxy le pega a 127.0.0.1:3000.
    #
    # ── POR QUÉ LOS DOS SON VARIABLES ─────────────────────────────────────────
    #
    # El PUERTO, porque 3000 no siempre está libre. En la máquina de desarrollo lo
    # tiene el frontend del ecommerce, y si ese proyecto también vive en el VPS,
    # ahí choca igual. Un puerto fijo convierte eso en un "port is already
    # allocated" en medio del primer deploy.
    #
    # La INTERFAZ, para poder probar por IP antes de que haya proxy y dominio:
    # con APP_BIND=0.0.0.0 el sitio se abre desde afuera y se puede mirar sin
    # tener nada más resuelto.
    #
    # ⚠️ APP_BIND=0.0.0.0 deja el sitio en internet SIN HTTPS: las contraseñas
    #    viajan en claro. Sirve para probar; para que entren clientas hay que
    #    volver a 127.0.0.1 y poner el proxy con certificado adelante.
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"

    # La app es sin estado: no escribe en disco. Lo que persiste vive en la base,
    # que es otro contenedor con su propio volumen.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Backup diario con rotación. Copiado de Ecommerce_mm, que ya lo tiene andando.
  #
  # ⚠️ La etiqueta de la imagen tiene que coincidir con la versión de Postgres.
  #    En el ecommerce es :15 porque su base es 15. Acá es 17.
  pg-backup:
    image: prodrigestivill/postgres-backup-local:17
    container_name: shiraf-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: shiraf
      POSTGRES_USER: shiraf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "59 23 * * *"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ./backups:/backups

  # ── WhatsApp por Evolution API ─────────────────────────────────────────────
  #
  # Los tres servicios de acá abajo están detrás del perfil `whatsapp`, o sea que
  # un `docker compose up` normal NO los levanta. Para encenderlos:
  #
  #     docker compose --profile whatsapp up -d
  #
  # Van con perfil porque son opcionales de verdad: sin ellos la app arranca
  # igual y los avisos salen por mail, que es como funcionó hasta ahora. En la
  # máquina de desarrollo casi nunca hacen falta y son tres contenedores más.
  #
  # ── 🔴 EL NÚMERO QUE SE VINCULA ACÁ ES DESCARTABLE ────────────────────────
  #
  # Evolution habla WhatsApp como un dispositivo vinculado, no por la API oficial
  # de Meta. Eso va contra los términos de servicio de WhatsApp y el castigo es
  # que **banean el número**. Por eso acá se vincula un chip comprado para esto y
  # NUNCA el número por el que el centro atiende clientas. El razonamiento
  # completo está en `evolution.service.ts` y en `docs/whatsapp-automatico.md`.
  #
  # ── POR QUÉ NO USA LA BASE DE LA APP ──────────────────────────────────────
  #
  # Evolution necesita su propio Postgres y su propio Redis. El Postgres podría
  # ser el de `db` con otra base adentro, y saldría más barato en RAM, pero
  # entonces un servicio no oficial escribiría en el mismo motor donde viven los
  # turnos y las clientas. Con contenedor y volumen aparte, el día que esto se
  # abandone se borran los dos volúmenes y no queda nada dando vueltas.
  evolution-db:
    image: postgres:17
    container_name: shiraf-evolution-db
    profiles: ["whatsapp"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      # Con `:-` y no con `:?`, igual que el SMTP y por el mismo motivo: Compose
      # interpola las variables de TODO el archivo aunque el perfil esté apagado,
      # así que un `:?` acá haría que `docker compose up` —el de la app sola— se
      # negara a arrancar por una variable de un servicio que ni se levanta.
      #
      # Vacía no es un default silencioso: Postgres se niega a inicializarse sin
      # contraseña y lo dice en su primer renglón de log. O sea que el error
      # aparece cuando se levanta el perfil, que es cuando corresponde.
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:-}
      POSTGRES_DB: evolution
    volumes:
      - shiraf-evolution-pgdata:/var/lib/postgresql/data
    # Sin `ports`: a esta base sólo le pega Evolution, por la red de compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  evolution-redis:
    image: redis:7-alpine
    container_name: shiraf-evolution-redis
    profiles: ["whatsapp"]
    restart: unless-stopped
    # Sin volumen a propósito: acá sólo hay caché de sesión. Lo que no se puede
    # perder —el vínculo con el chip— vive en el volumen de instancias de abajo.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution:
    # ⚠️ Versión fijada, no `latest`: Evolution rompe cosas entre versiones y una
    #    sesión de WhatsApp que se desvincula sola hay que volver a escanearla
    #    desde el teléfono del centro. Subirla es una decisión, no un arranque.
    #
    #    Si esta imagen no baja, el proyecto se movió de organización más de una
    #    vez y el nombre viejo es `atendai/evolution-api`. Verificar contra el
    #    repo antes de cambiarla.
    image: ${EVOLUTION_IMAGE:-evoapicloud/evolution-api:v2.2.3}
    container_name: shiraf-evolution
    profiles: ["whatsapp"]
    restart: unless-stopped
    depends_on:
      evolution-db:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    environment:
      # 🔴 Esta llave abre TODO Evolution, incluido leer las conversaciones del
      # número vinculado. No es la clave de un servicio más: tratarla como la
      # service role. Por eso el puerto de abajo es sólo loopback.
      #
      # ⚠️ Va con `:-` por lo mismo que la contraseña de arriba —no romper el
      #    arranque de la app—, pero acá el default vacío SÍ es peligroso: un
      #    Evolution sin llave acepta a cualquiera que llegue al puerto. Está
      #    atenuado porque el puerto es loopback, no porque esté bien. **Ponerla
      #    en el `.env` antes de levantar el perfil**, y larga: es la única
      #    puerta que tiene este servicio.
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-}
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}

      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-db:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: shiraf

      # Lo mínimo que Evolution necesita guardar para funcionar, y nada más.
      #
      # No es ahorro de disco: es que este número NO lee conversaciones. Sólo
      # manda avisos. Guardar mensajes, contactos y chats sería acumular datos de
      # clientas —quién se atiende, de qué— en la base de un servicio no oficial
      # que nadie va a mirar nunca. Si algún día se necesita depurar un envío, el
      # motivo del fallo ya queda en el log de la app.
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"

      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/1
      CACHE_REDIS_PREFIX_KEY: shiraf
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"

      LOG_LEVEL: ${EVOLUTION_LOG_LEVEL:-ERROR}
      DEL_INSTANCE: "false"

    # 🔴 SÓLO LOOPBACK, y esto no es una preferencia.
    #
    # Con la API key, cualquiera que llegue a este puerto puede mandar WhatsApp
    # a nombre del número vinculado y leer lo que le entre. No hay login, no hay
    # usuarios: la llave es todo. A internet no sale nunca — ni siquiera detrás
    # del reverse proxy, porque no hay motivo para que se llegue desde afuera.
    #
    # Para escanear el QR la primera vez se abre desde la máquina con un túnel
    # SSH: `ssh -L 8080:127.0.0.1:8080 usuario@vps`, y después localhost:8080.
    ports:
      - "127.0.0.1:${EVOLUTION_PORT:-8080}:8080"

    # Acá vive el vínculo con el chip. Si este volumen se pierde, hay que volver
    # a escanear el QR desde el teléfono — que es el único paso de todo esto que
    # necesita a una persona con el celular en la mano.
    volumes:
      - shiraf-evolution-instances:/evolution/instances

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  shiraf-pgdata:
  shiraf-evolution-pgdata:
  shiraf-evolution-instances:
