# Shiraf — producción.
#
# Compose lee automáticamente el .env de esta carpeta para resolver los ${...}.
# Las variables que hacen falta están listadas en .env.example.
#
# El arranque es una cadena, no cuatro servicios sueltos:
#
#     db  ──sano──>  migrate  ──termina bien──>  app
#     └── pg-backup
#
# `migrate` corre una vez, sincroniza el esquema y se apaga. Que la app aplique
# migraciones al arrancar está mal en cuanto hay más de una réplica —dos
# procesos migrando la misma base a la vez— y además mezcla responsabilidades.

services:
  db:
    image: postgres:17
    container_name: shiraf-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: shiraf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: shiraf
    volumes:
      - shiraf-pgdata:/var/lib/postgresql/data
    # Sólo loopback: la app le pega por la red interna de compose, donde el host
    # es `db`. Publicarlo acá es para poder abrir Prisma Studio o psql desde la
    # máquina; a internet no tiene que salir nunca.
    #
    # El puerto del host sale por variable porque no siempre está libre: en la
    # máquina de desarrollo lo tienen otros proyectos. En el VPS, donde ésta es
    # la única base, el 5432 por defecto está bien.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiraf -d shiraf"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    image: shiraf-app:latest
    container_name: shiraf-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://shiraf:${POSTGRES_PASSWORD}@db:5432/shiraf
    # Dos pasos, como en Ecommerce_mm:
    #   1. `db push` sincroniza las tablas con schema.prisma
    #   2. post-push vuelve a poner lo que push no sabe manejar (los 3 triggers,
    #      el CHECK de turnos, los 4 indices parciales) y VERIFICA que quedaron.
    #      Si falta alguna, sale con error y la cadena se corta acá: la app no
    #      arranca contra una base a la que le falta el candado de los turnos.
    #
    # Se invoca el binario directo y no `npx`: la imagen no tiene npm, y `npx`
    # se bajaría Prisma de internet en cada arranque del contenedor.
    command:
      - sh
      - -c
      - node node_modules/prisma/build/index.js db push && node scripts/post-push.mjs
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build arg, no environment: se hornea en el bundle del navegador.
        # Es público —aparece en la URL de cada foto— pero sin él no hay fotos.
        VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME:?falta VITE_CLOUDINARY_CLOUD_NAME en .env}
    image: shiraf-app:latest
    container_name: shiraf-app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0

      # `db` y no `localhost`: adentro de la red de compose el host es el nombre
      # del servicio. Es el error más frecuente del armado y el mensaje
      # —getaddrinfo ENOTFOUND db— no lo sugiere.
      DATABASE_URL: postgresql://shiraf:${POSTGRES_PASSWORD}@db:5432/shiraf

      # Firma las sesiones. Si cambia, todas las cuentas quedan deslogueadas.
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      # Para armar los links de los mails de confirmación y de recuperación.
      APP_URL: ${APP_URL:?falta APP_URL en .env}

      # Cloudinary del lado servidor: firma las subidas y los borrados. El api
      # secret NUNCA como build arg ni con prefijo VITE_ — eso lo dejaría
      # horneado en el bundle que baja el navegador, y con él se puede borrar
      # cualquier imagen de la cuenta.
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?falta CLOUDINARY_CLOUD_NAME en .env}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?falta CLOUDINARY_API_KEY en .env}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?falta CLOUDINARY_API_SECRET en .env}

      # Mails: avisos de turno, recordatorios y los de cuenta (confirmar el
      # mail, recuperar la contraseña). Salen por SMTP con nodemailer, igual que
      # en Ecommerce_mm: la casilla de Gmail del centro con una contraseña de
      # aplicación. No hay servicio de terceros ni dominio que verificar.
      #
      # Todas van con `:-` y NO con `:?`, o sea que su ausencia no frena el
      # arranque. Es a propósito y respeta una decisión que ya vive en el código:
      # email.service.ts devuelve "todavía no está configurado" en vez de tirar —
      #
      #   "Se tiene que poder trabajar sin el correo resuelto. Lo que NO se hace
      #    es tragarse el fracaso en silencio."
      #
      # Con `:?` el contenedor se negaba a levantar, y eso ya pasó: el primer
      # `docker compose up` moría acá porque el correo todavía no estaba
      # resuelto, sin relación aparente con lo que se estaba probando.
      #
      # No es que no haya que configurarlas: hay que hacerlo antes de abrir el
      # centro. Pero eso lo avisa el panel cuando un turno se confirma y el mail
      # no sale, que es donde se entiende. No un compose que no arranca.
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}

      # Acá vivía REMINDERS_SECRET, que era obligatoria —con `:?`, o sea que sin
      # ella el contenedor no levantaba— y ya no existe. Era la llave de
      # POST /api/recordatorios, el endpoint que disparaba un cron de afuera.
      # Ahora el reloj corre adentro del proceso, así que no hay puerta que
      # cerrar con llave: ver src/server/services/reminders.service.ts.

    # Por defecto, sólo loopback: en el VPS ya hay un reverse proxy para los
    # otros dos sitios, así que este contenedor no debe quedar expuesto directo a
    # internet. El proxy le pega a 127.0.0.1:3000.
    #
    # ── POR QUÉ LOS DOS SON VARIABLES ─────────────────────────────────────────
    #
    # El PUERTO, porque 3000 no siempre está libre. En la máquina de desarrollo lo
    # tiene el frontend del ecommerce, y si ese proyecto también vive en el VPS,
    # ahí choca igual. Un puerto fijo convierte eso en un "port is already
    # allocated" en medio del primer deploy.
    #
    # La INTERFAZ, para poder probar por IP antes de que haya proxy y dominio:
    # con APP_BIND=0.0.0.0 el sitio se abre desde afuera y se puede mirar sin
    # tener nada más resuelto.
    #
    # ⚠️ APP_BIND=0.0.0.0 deja el sitio en internet SIN HTTPS: las contraseñas
    #    viajan en claro. Sirve para probar; para que entren clientas hay que
    #    volver a 127.0.0.1 y poner el proxy con certificado adelante.
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"

    # La app es sin estado: no escribe en disco. Lo que persiste vive en la base,
    # que es otro contenedor con su propio volumen.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Backup diario con rotación. Copiado de Ecommerce_mm, que ya lo tiene andando.
  #
  # ⚠️ La etiqueta de la imagen tiene que coincidir con la versión de Postgres.
  #    En el ecommerce es :15 porque su base es 15. Acá es 17.
  pg-backup:
    image: prodrigestivill/postgres-backup-local:17
    container_name: shiraf-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: shiraf
      POSTGRES_USER: shiraf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "59 23 * * *"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ./backups:/backups

volumes:
  shiraf-pgdata:
